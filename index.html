<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מיזם ח״ץ | מערכת איגום נתונים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        /* ══ RESET & PREMIUM BASE ══════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow-x: hidden; }

        :root {
            --bg-pure:     #fcfcfd;
            --text-dark:   #0f172a;
            --text-muted:  #64748b;
            --blue-accent: #0066cc;
            --blue-light:  #3385ff;
            --border-soft: #e2e8f0;
            --surface:     rgba(255, 255, 255, 0.7);
            --font:        'Heebo', -apple-system, sans-serif;

            --shadow-float: 0 20px 40px -5px rgba(0,0,0,0.05), 0 10px 15px -5px rgba(0,0,0,0.02);
            --shadow-hover: 0 25px 50px -12px rgba(0, 102, 204, 0.15);
        }

        body {
            font-family: var(--font);
            direction: rtl;
            background-color: var(--bg-pure);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* ══ STUDIO BACKGROUND (Animated) ══════════════════ */
        .bg-glow {
            position: fixed; top: -5%; left: 5%; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(0, 102, 204, 0.05) 0%, transparent 60%);
            z-index: -2; pointer-events: none;
            animation: ambientGlow 15s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: fixed; bottom: -10%; right: -5%; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(51, 133, 255, 0.04) 0%, transparent 60%);
            z-index: -2; pointer-events: none;
            animation: ambientGlow 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes ambientGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(3%, 3%); }
        }

        .bg-dots {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
            background-size: 32px 32px; opacity: 0.5;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 90%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 90%);
        }

        /* ══ LAYOUT ════════════════════════════════════════ */
        .page {
            position: relative; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 40px 5vw;
        }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center; width: 100%; max-width: 1300px;
        }

        /* ══ TYPOGRAPHY (LEFT SIDE) ════════════════════════ */
        .content-side { display: flex; flex-direction: column; align-items: flex-start; }

        .badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 20px; padding: 6px 16px;
            font-size: 0.8rem; font-weight: 500;
            color: var(--text-muted); margin-bottom: 32px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            opacity: 0; animation: fadeUp 0.8s 0.2s ease forwards;
        }
        .bdot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--blue-accent);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        .headline { margin-bottom: 24px; opacity: 0; animation: fadeUp 0.8s 0.3s ease forwards; }

        .hl-eyebrow {
            display: block; font-size: 1.1rem;
            font-weight: 400; color: var(--text-muted); margin-bottom: 8px;
        }

        .hl-brand {
            display: block;
            font-size: clamp(3rem, 4.5vw, 4.5rem);
            font-weight: 800; line-height: 1.1; letter-spacing: -0.03em;
            color: var(--text-dark);
        }

        /* טקסט נתונים עם ברק אנימטיבי עדין */
        .text-gradient {
            background: linear-gradient(135deg, var(--blue-accent) 0%, var(--blue-light) 40%, #00d2ff 60%, var(--blue-accent) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 6s linear infinite;
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        .desc-container {
            font-size: 1.25rem; font-weight: 400; color: var(--text-muted);
            line-height: 1.7; max-width: 520px;
            margin-bottom: 48px; min-height: 85px;
            opacity: 0; animation: fadeUp 0.8s 0.4s ease forwards;
        }

        .typing-cursor {
            display: inline-block; width: 2px; height: 1.1em;
            background-color: var(--blue-accent);
            vertical-align: text-bottom; margin-right: 4px;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* CTA Button */
        .cta-zone { opacity: 0; animation: fadeUp 0.8s 0.5s ease forwards; }

        .cta-btn {
            display: inline-flex; align-items: center; gap: 12px;
            /* gradient animated background instead of solid color */
            background: linear-gradient(135deg, var(--blue-accent) 0%, var(--blue-light) 40%, #00d2ff 60%, var(--blue-accent) 100%);
            background-size: 200% auto;
            animation: shineBG 6s linear infinite;
            color: #ffffff;
            font-weight: 600; font-size: 1.05rem;
            padding: 16px 32px; border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(0, 102, 204, 0.25);
            position: relative;
        }

        /* הילת קריאה לפעולה */
        .cta-btn::before {
            content: '';
            position: absolute; inset: 0; border-radius: 12px;
            box-shadow: 0 0 0 0 rgba(0, 102, 204, 0.4);
            animation: pulseCTA 2.5s infinite cubic-bezier(0.66, 0, 0, 1);
        }

        @keyframes pulseCTA {
            to { box-shadow: 0 0 0 15px rgba(0, 102, 204, 0); }
        }

        /* animated gradient for CTA background */
        @keyframes shineBG {
            to { background-position: 200% center; }
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 102, 204, 0.35);
        }
        .cta-btn:hover::before { animation: none; } /* כיבוי הפעימה בריחוף */

        .cta-btn i { font-size: 0.9rem; transition: transform 0.3s ease; }
        .cta-btn:hover i { transform: translateX(-4px); }

        .cta-note { display: block; margin-top: 12px; font-size: 0.85rem; color: var(--text-muted); }

        /* ══ VISUAL SIDE (RIGHT) ═══════════════════════════ */
        .visual-side {
            display: flex; flex-direction: row;
            align-items: center; justify-content: flex-start;
            gap: 30px;
            opacity: 0; animation: fadeIn 1s 0.4s ease forwards;
        }

        /* ══ WIDGETS (Modals) ══════════════════════════════ */
        .widgets-container { display: flex; flex-direction: column; gap: 20px; }

        /* עוטף הריחוף המתמיד */
        .widget-wrap { animation: floatIdle 6s ease-in-out infinite; }
        .widget-wrap:nth-child(2) { animation-delay: 1.5s; }
        .widget-wrap:nth-child(3) { animation-delay: 3s; }

        .widget {
            background: var(--surface);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-soft);
            border-radius: 16px; padding: 18px 22px;
            display: flex; align-items: center; gap: 16px;
            box-shadow: var(--shadow-float);
            white-space: nowrap;
            transform: translateX(30px); opacity: 0;
            animation: slideInWidget 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
        }

        .widget:hover {
            transform: translateY(-3px) scale(1.02) !important;
            border-color: rgba(0, 102, 204, 0.3);
            box-shadow: var(--shadow-hover);
        }

        .widget-wrap:nth-child(1) .widget { animation-delay: 0.7s; }
        .widget-wrap:nth-child(2) .widget { animation-delay: 0.9s; }
        .widget-wrap:nth-child(3) .widget { animation-delay: 1.1s; }

        .w-icon {
            width: 44px; height: 44px;
            background: #f0f7ff; color: var(--blue-accent);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
        }

        .w-text { display: flex; flex-direction: column; gap: 4px; }
        .w-title { font-weight: 700; font-size: 0.95rem; color: var(--text-dark); line-height: 1; }
        .w-sub { font-size: 0.8rem; color: var(--text-muted); }

        /* ══ 3D PHONE MOCKUP ═══════════════════════════════ */
        .phone-scene { perspective: 2000px; }

        /* הוספת שכבת ריחוף שאינה מתנגשת עם ה-JS */
        .phone-levitate {
            animation: floatIdle 8s ease-in-out infinite;
        }

        .phone-wrap {
            transform: rotateY(-15deg) rotateX(5deg) rotateZ(1deg);
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
        }

        /* --- הוספת CSS למסגרת בגווני כחול ושחור --- */
        .phone-ai-wrapper {
            position: relative;
            padding: 2.5px; /* עובי המסגרת */
            border-radius: 49px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-ai-wrapper::before {
            content: '';
            position: absolute;
            width: 150%; height: 150%;
            /* שינוי גוונים לכחול ושחור */
            background: conic-gradient(
                from 0deg,
                #000000 0%,
                #003366 25%,
                #0066cc 50%,
                #3385ff 75%,
                #000000 100%
            );
            animation: rotateAI 4s linear infinite;
        }

        @keyframes rotateAI {
            to { transform: rotate(360deg); }
        }
        /* ------------------------------- */

        .phone-body {
            width: 260px; height: 540px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e2e8f0 100%);
            border: 1px solid #cbd5e1; border-radius: 46px;
            position: relative; padding: 10px;
            box-shadow:
                -15px 25px 45px -10px rgba(0, 0, 0, 0.1),
                inset 0 0 0 1px rgba(255,255,255,0.9);
            transform-style: preserve-3d;
            z-index: 1;
        }

        .phone-screen {
            width: 100%; height: 100%; background: #000;
            border-radius: 36px; border: 2px solid #0f172a;
            overflow: hidden; position: relative;
        }

        .phone-video { width: 100%; height: 100%; object-fit: cover; }

        .dyn-island {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 85px; height: 26px; background: #000; border-radius: 14px; z-index: 10;
        }

        .sb { position: absolute; background: #cbd5e1; border-radius: 2px;}
        .sb-m  { top: 90px; left: -3px; width: 3px; height: 24px; }
        .sb-v1 { top: 130px; left: -3px; width: 3px; height: 46px; }
        .sb-v2 { top: 185px; left: -3px; width: 3px; height: 46px; }
        .sb-pw { top: 150px; right: -3px; width: 3px; height: 60px; }

        /* ══ KEYFRAMES ═════════════════════════════════════ */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInWidget { to { opacity: 1; transform: translateX(0); } }

        /* אנימציית ריחוף אידיאלית לאלמנטים צפים */
        @keyframes floatIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ══ RESPONSIVE ════════════════════════════════════ */
        @media(max-width: 1100px) {
            .split { grid-template-columns: 1fr; justify-items: center; gap: 60px; text-align: center; }
            .content-side { align-items: center; padding-left: 0; }
            .desc-container { margin: 0 auto 40px auto; }
            .visual-side { flex-direction: row-reverse; justify-content: center; }
        }
        @media(max-width: 768px) {
            .visual-side { flex-direction: column; }
            .widgets-container { align-items: center; }
            .phone-wrap { transform: rotateY(0) rotateX(0) rotateZ(0); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>
    <div class="bg-dots"></div>

    <div class="page">
        <div class="split">

            <div class="content-side">
                <div class="badge">
                    <span class="bdot"></span> פלטפורמה פעילה ומאובטחת
                </div>

                <div class="headline">
                    <span class="hl-eyebrow">מיזם ח״ץ - איגום נתונים חקלאיים</span>
                    <h1 class="hl-brand">מערכת  <span class="text-gradient">איגום נתונים</span></h1>
                </div>

                <div class="desc-container" id="typewriter-container">
                    <span id="typewriter-text"></span><span class="typing-cursor"></span>
                </div>

                <div class="cta-zone">
                    <a href="login.html" class="cta-btn">
                        <span>למערכת </span>
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <span class="cta-note">גישה למורשים/ות בלבד.</span>
                </div>
            </div>

            <div class="visual-side">

                <div class="widgets-container">
                    <div class="widget-wrap">
                        <div class="widget">
                            <div class="w-icon"><i class="fa-solid fa-flask"></i></div>
                            <div class="w-text">
                                <span class="w-title">ניהול ניסויים</span>
                                <span class="w-sub">צפו, צרו ושתפו ניסויים חקלאיים</span>
                            </div>
                        </div>
                    </div>

                    <div class="widget-wrap">
                        <div class="widget">
                            <div class="w-icon"><i class="fa-solid fa-tractor"></i></div>
                            <div class="w-text">
                                <span class="w-title">איסוף נתוני שדה</span>
                                <span class="w-sub">השקיה, צמיחה, אגרוטכניקה ויבולים</span>
                            </div>
                        </div>
                    </div>

                    <div class="widget-wrap">
                        <div class="widget">
                            <div class="w-icon"><i class="fa-solid fa-file-excel"></i></div>
                            <div class="w-text">
                                <span class="w-title">ייצוא ודוחות</span>
                                <span class="w-sub">הוריד/ה קבצים ל־Excel ודוחות לניתוח</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="phone-scene">
                    <div class="phone-levitate">
                        <div class="phone-wrap" id="phone3d">
                            <div class="phone-ai-wrapper">
                                <div class="phone-body">
                                    <div class="sb sb-m"></div><div class="sb sb-v1"></div>
                                    <div class="sb sb-v2"></div><div class="sb sb-pw"></div>

                                    <div class="phone-screen">
                                        <div class="dyn-island"></div>
                                        <video class="phone-video" id="vid" autoplay loop muted playsinline>
                                            <source src="Recording to mock.mp4" type="video/mp4">
                                        </video>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

<script>
    // 1. Video Setup
    document.addEventListener('DOMContentLoaded', () => {
        const v = document.getElementById('vid');
        if (v) {
            v.playbackRate = 2.0;
            v.play().catch(e => console.log("Autoplay prevented:", e));
        }
    });

    // 2. Typewriter Effect
    const runTypewriter = () => {
        const descElement = document.getElementById('typewriter-text');
        if (!descElement) return;

        const textLines = [
            "מערכת לניהול ניסויים חקלאיים ושיתוף ידע.",
            "איסוף נתוני שדה, יצירת ניסויים, שיתוף וייצוא דוחות."
        ];

        let lineIndex = 0;
        let charIndex = 0;
        let currentHTML = "";

        const typeLine = () => {
            if (lineIndex < textLines.length) {
                if (charIndex < textLines[lineIndex].length) {
                    currentHTML += textLines[lineIndex].charAt(charIndex);
                    descElement.innerHTML = currentHTML;
                    charIndex++;
                    setTimeout(typeLine, Math.random() * 25 + 25);
                } else {
                    currentHTML += "<br>";
                    descElement.innerHTML = currentHTML;
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeLine, 600);
                }
            }
        };

        setTimeout(typeLine, 1000);
    };
    runTypewriter();

    // 3. Smooth Mouse Parallax
    const initPhoneParallax = () => {
        if(window.innerWidth <= 1100) return;

        const phone = document.getElementById('phone3d');
        if(!phone) return;

        const baseRY = -15, baseRX = 5;
        let tRY = baseRY, tRX = baseRX, cRY = baseRY, cRX = baseRX;

        document.addEventListener('mousemove', e => {
            const nx = (e.clientX / window.innerWidth) * 2 - 1;
            const ny = (e.clientY / window.innerHeight) * 2 - 1;

            tRY = baseRY + (nx * 8);
            tRX = baseRX - (ny * 5);
        });

        document.addEventListener('mouseleave', () => {
            tRY = baseRY; tRX = baseRX;
        });

        const renderParallax = () => {
            cRY += (tRY - cRY) * 0.08;
            cRX += (tRX - cRX) * 0.08;
            phone.style.transform = `rotateY(${cRY}deg) rotateX(${cRX}deg) rotateZ(1deg)`;
            requestAnimationFrame(renderParallax);
        };
        renderParallax();
    };
    initPhoneParallax();

</script>
</body>
</html>
