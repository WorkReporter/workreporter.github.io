<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דיווח תקלות - מיזם ח"ץ</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=20260503-1">
    <link rel="stylesheet" href="css/layout.css?v=20260503-1">
    <link rel="stylesheet" href="css/accessibility.css?v=20260503-1">
    <link rel="stylesheet" href="css/research-map.css?v=20260503-1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-page-context="report-issue">
    <button class="hamburger-btn" id="hamburger-btn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="user-info">
                <i class="fas fa-user"></i>
                <span id="user-display-name"></span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>בית</span>
                </a>
                <a href="export.html" class="nav-item">
                    <i class="fas fa-file-export"></i>
                    <span>שליפת ניסוי</span>
                </a>
                <a href="my-bi.html" class="nav-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>הסטטיסטיקה שלי</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=1Ts8Nb7SBUedhjc0Bkz5yY9XvXTtZwZBjymvdvhbcjNUOVdGWUNWV1FYOFRERDRES1BQWjhXMzhSVy4u" class="btn-report-issue" target="_blank" rel="noopener">
                    <i class="fas fa-triangle-exclamation"></i>
                    <span>דיווח תקלות</span>
                    <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                </a>
                <button id="btn-logout" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>התנתקות</span>
                </button>
            </div>
        </aside>

        <main class="main-content" style="padding: 24px; background: #f8fafc;">
            <div style="max-width: 1100px; margin: 0 auto;">
                <div class="breadcrumb" style="margin-bottom: 16px;">
                    <span class="breadcrumb-link" onclick="window.location.href='dashboard.html'">בית</span>
                    <span> / </span>
                    <span class="breadcrumb-current">דיווח תקלות</span>
                </div>

                <div style="background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,0.06);padding:24px;">
                    <h1 style="margin-bottom:8px;">דיווח תקלות</h1>
                    <p style="margin-bottom:18px;color:#475569;line-height:1.7;">
                        אם הטופס לא מוצג היטב, אפשר לפתוח אותו ישירות כאן:
                    </p>

                    <div style="margin-bottom:18px; padding:14px 16px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px;">
                        <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=1Ts8Nb7SBUedhjc0Bkz5yY9XvXTtZwZBjymvdvhbcjNUOVdGWUNWV1FYOFRERDRES1BQWjhXMzhSVy4u" target="_blank" rel="noopener noreferrer" style="color:#1d4ed8; font-weight:600;">
                            לא מוצג היטב? לחץ כאן
                        </a>
                    </div>

                    <div style="width:100%; overflow:hidden; border:1px solid #e5e7eb; border-radius:12px; background:#fff;">
                        <iframe width="640px" height="480px" src="https://forms.office.com/Pages/ResponsePage.aspx?id=1Ts8Nb7SBUedhjc0Bkz5yY9XvXTtZwZBjymvdvhbcjNUOVdGWUNWV1FYOFRERDRES1BQWjhXMzhSVy4u&embed=true" frameborder="0" marginwidth="0" marginheight="0" style="border: none; width: 100%; min-height: 78vh; max-height: 100vh;" allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </main>
    </div>

            <script type="module" src="js/research-map.js?v=20260503-1"></script>
            <script type="module">
                import { auth } from "./js/firebase-config.js";
                import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

                const hamburgerBtn = document.getElementById('hamburger-btn');
                const sidebar = document.querySelector('.sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                const logoutBtn = document.getElementById('btn-logout');

                if (hamburgerBtn && sidebar) {
                    hamburgerBtn.addEventListener('click', () => {
                        sidebar.classList.toggle('open');
                        if (overlay) overlay.classList.toggle('active');
                        const icon = hamburgerBtn.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('fa-bars');
                            icon.classList.toggle('fa-times');
                        }
                    });
                }

                if (overlay) {
                    overlay.addEventListener('click', () => {
                        sidebar.classList.remove('open');
                        overlay.classList.remove('active');
                        const icon = hamburgerBtn?.querySelector('i');
                        if (icon) {
                            icon.classList.add('fa-bars');
                            icon.classList.remove('fa-times');
                        }
                    });
                }

                if (logoutBtn) {
                    logoutBtn.addEventListener('click', async () => {
                        await signOut(auth);
                        window.location.href = 'login.html';
                    });
                }
            </script>
</body>
</html>
